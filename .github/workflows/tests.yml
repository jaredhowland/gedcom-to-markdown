name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        pytest --cov=src --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  example_plugin:
    name: Example plugin integration
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Install example plugin (editable)
        run: |
          pip install -e examples/example_canvas_plugin

      - name: Find root person in GEDCOM
        run: |
          ROOT=$(python - <<'PY'
          import sys
          from pathlib import Path
          from parser_io import parse_from_path
          p = parse_from_path(Path('jaredhowland-8gen.ged'))
          inds = p.get_individuals()
          if not inds:
              sys.exit(1)
          print(inds[0].get_pointer())
          PY
          )
          echo "ROOT_ID=$ROOT" >> $GITHUB_ENV

      - name: Run converter with example plugin
        run: |
          python src/main.py -i jaredhowland-8gen.ged -o out_example_plugin --canvas --canvas-plugin example --root "$ROOT_ID"

      - name: Verify canvas created
        run: |
          if [ -f "out_example_plugin/Family Tree.canvas" ]; then
            echo "Canvas generated"
            ls -l "out_example_plugin/Family Tree.canvas"
          else
            echo "Canvas missing" && exit 1
          fi

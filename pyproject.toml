[project]
name = "gedcom-to-markdown"
version = "0.1.0"
description = "Convert GEDCOM genealogy files to Obsidian-compatible Markdown notes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-gedcom==1.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project.optional-dependencies]
# Development and test dependencies
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

# Entry points for external canvas plugins.
# Third-party packages can expose their Canvas implementations here.
# Example:
#   [project.entry-points."gedcom_to_markdown.canvas_plugins"]
#   my_plugin = "my_package.plugins:MyPluginClass"
